# Global systemd user environment defaults (DE-agnostic only).
#
# Ryoku-specific Qt/GTK/cursor/Polkit overrides (QT_QPA_PLATFORMTHEME,
# QT_WAYLAND_DISABLE_WINDOWDECORATION, GSK_RENDERER, RYOKU_POLKIT_AGENT, etc.)
# are NO LONGER set here globally, so KDE Plasma / GNOME / XFCE sessions never
# inherit Ryoku's look or behaviour. They are imported dynamically only while a
# Ryoku session is active (with RYOKU_SESSION_KEY) and unset on logout.

QML_IMPORT_PATH=$HOME/.local/lib/qt6/qml
QML2_IMPORT_PATH=$HOME/.local/lib/qt6/qml

PATH=$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

EDITOR=nvim
VISUAL=nvim
