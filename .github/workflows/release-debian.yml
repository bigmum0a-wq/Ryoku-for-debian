name: Release Debian & Kali Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.2.3-1)'
        required: true
        default: '1.2.3-1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PKGVER="${{ inputs.version }}"
            TAG="v${PKGVER%%-*}"
          else
            TAG="${GITHUB_REF_NAME}"
            RAW="${TAG#v}"
            PKGVER="${RAW}-1"
          fi
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'ryoku/shell/ipc/go.mod'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev apt-utils gnupg \
            pkg-config wayland-protocols libwayland-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Import GPG signing key (if configured)
        env:
          GPG_KEY: ${{ secrets.RYOKU_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_KEY" ]; then
            printf '%s\n' "$GPG_KEY" | gpg --batch --import
            echo "RYOKU_GPG_KEY=packaging@ryoku.dev" >> "$GITHUB_ENV"
          else
            echo "::notice::RYOKU_GPG_PRIVATE_KEY not set; building unsigned release"
          fi

      - name: Build .deb packages & signed APT repository
        run: |
          umask 0022
          RYOKU_PKGVER="${{ steps.ver.outputs.pkgver }}" \
            bash debian/packages/repo/build-deb-repo.sh

      - name: Package release tarball & checksums
        run: |
          mkdir -p dist
          TAR_VER="${{ steps.ver.outputs.tag }}"
          TAR_VER="${TAR_VER#v}"
          tar -czf "dist/ryoku-deb-repo-${TAR_VER}.tar.gz" \
            -C debian/packages/repo out
          cp debian/packages/repo/out/pool/main/r/ryoku/*.deb dist/
          cp debian/packages/repo/out/pool/main/r/ryoku/SHA256SUMS dist/ || true
          cp debian/packages/repo/out/pool/main/r/ryoku/SHA256SUMS.asc dist/ || true
          cp keys/ryoku-debian-release.pub.asc dist/ || true
          cp debian/packages/repo/install-online.sh dist/ || true

      - name: Stage GitHub Pages APT repository
        run: |
          mkdir -p gh-pages-stage/apt
          cp -r debian/packages/repo/out/* gh-pages-stage/apt/
          cp keys/ryoku-debian-release.pub.asc gh-pages-stage/ryoku-debian-release.pub.asc
          touch gh-pages-stage/.nojekyll
          cat << 'HTML' > gh-pages-stage/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Ryoku Desktop — Debian &amp; Kali APT Repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1.2rem; background: #0d1117; color: #e6edf3; line-height: 1.6; }
              pre { background: #161b22; padding: 1rem; border-radius: 8px; overflow-x: auto; border: 1px solid #30363d; }
              code { font-family: monospace; color: #79c0ff; }
              a { color: #58a6ff; }
            </style>
          </head>
          <body>
            <h1>Ryoku Desktop — Debian &amp; Kali APT Repository</h1>
            <p>Install Ryoku Desktop directly via <code>apt</code> on Debian 13 (Trixie), Kali Linux, or ParrotOS:</p>
            <pre><code>curl -fsSL https://bigmum0a-wq.github.io/Ryoku-for-debian/ryoku-debian-release.pub.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/ryoku-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/ryoku-archive-keyring.gpg] https://bigmum0a-wq.github.io/Ryoku-for-debian/apt trixie main" \
            | sudo tee /etc/apt/sources.list.d/ryoku.list

          sudo apt update && sudo apt install -y ryoku-desktop</code></pre>
            <p>Repository root: <a href="./apt/">./apt/</a> | Public key: <a href="./ryoku-debian-release.pub.asc">ryoku-debian-release.pub.asc</a></p>
          </body>
          </html>
          HTML

      - name: Deploy APT repository to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-stage
          publish_branch: gh-pages
          commit_message: "apt: publish ${{ steps.ver.outputs.tag }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Ryoku Desktop Debian/Kali ${{ steps.ver.outputs.tag }}
          body: |
            Ryoku Desktop for Debian 13 (Trixie), Kali Linux & ParrotOS (${{ steps.ver.outputs.tag }}).

            ### Included
            - 7 native `.deb` packages (`ryoku-desktop`, `ryoku-desktop-hyprland`, `ryoku-shell`, `ryoku-cli`, `ryoku-palette-bridge`, `ryoku-blobs`, `ryoku-archive-keyring`)
            - `ryoku-deb-repo-*.tar.gz` (full GPG-signed APT repository)
            - `SHA256SUMS`, `SHA256SUMS.asc`, and `ryoku-debian-release.pub.asc` (Ed25519 signing key)
            - `install-online.sh`
          files: |
            dist/*
